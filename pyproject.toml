# Tooling configuration for the hermes-lcm plugin.
#
# This file exists only to pin lint settings so `ruff` behaves identically
# locally and in CI. The plugin is installed via scripts/install.sh, not pip.
#
# The [project] table below is deliberately inert: it declares no dependencies
# and `package = false` keeps uv from ever building or installing this tree.
# It exists because Hermes' package manager treats ANY plugin directory holding
# a pyproject.toml as a uv workspace member, and uv refuses to lock a workspace
# whose member has no [project] table ("No `project` table found in ..."),
# which fails the whole `hermes update`. Keep name/version/requires-python
# present; they are the minimum uv accepts.

[project]
name = "hermes-lcm-plugin"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
# Match the oldest runtime CI exercises; keeps lint aligned with the 3.11 leg.
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) plus a focused pycodestyle subset
# (E4/E7/E9). We deliberately do not enable line-length (E501) or import
# sorting (I) -- the codebase predates both and enforcing either would be a
# large, purely cosmetic reformat with no behavioural benefit.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # module-import-not-at-top-of-file: several modules import after a
    # sys.path / optional-dependency bootstrap, so imports legitimately
    # follow executable statements.
    "E402",
]
